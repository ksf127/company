apiVersion: v1
kind: Service
metadata:
  name: {{ include "company-service.name" . }}
  labels:
    {{- include "company-service.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "company-service.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
