image:
  repository: registry.company.com/user-service
  tag: "1.0.0"

env:
  NACOS_ADDR: "nacos.infra:8848"
  NACOS_NS: "prod"
  NACOS_GROUP: "DEFAULT_GROUP"
  ENV: "prod"
  USER_DB_URL: "jdbc:mysql://mysql.infra:3306/user_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
  USER_DB_USER: "app"

# USER_DB_PASSWORD 等敏感值由 Secret 注入
secretName: user-db-secret
replicaCount: 3
