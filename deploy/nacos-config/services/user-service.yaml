# L2 user-service 专属配置：每个服务独立数据库（Database per Service）。
# 账号密码由 K8s Secret 注入环境变量，配置文件里永远不出现明文。
# Nacos: dataId=user-service.yaml, group=DEFAULT_GROUP
server:
  port: 8084

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${USER_DB_USER:app}
    password: ${USER_DB_PASSWORD:}
    hikari:
      # 本服务读多写少，池子比 L1 默认值小
      maximum-pool-size: 30

mybatis-plus:
  global-config:
    db-config:
      table-prefix: t_
